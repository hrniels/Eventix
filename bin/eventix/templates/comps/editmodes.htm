<div class="ev_response_dropdown ev_edit_modes" id="{{ id }}-dropdown">
    <a id="{{ id }}-toggle" class="ev_button ev_button_normal">
        <i class="bi bi-pencil"></i>
        <span>{{ "Edit"|t(locale) }}</span>
    </a>
    <div id="{{ id }}-menu" class="ev_response_menu ev_response_menu_big">
        <a class="ev_button ev_button_normal ev_edit_modes_action" data-value="Occurrence">
            <i class="bi bi-calendar-event"></i>
            <span>{{ "This occurrence"|t(locale) }}</span>
        </a>
        <a class="ev_button ev_button_normal ev_edit_modes_action" data-value="Following">
            <i class="bi bi-calendar-range"></i>
            <span>{{ "This and following occ."|t(locale) }}</span>
        </a>
        <a class="ev_button ev_button_normal ev_edit_modes_action" data-value="Series">
            <i class="bi bi-arrow-clockwise"></i>
            <span>{{ "Complete series"|t(locale) }}</span>
        </a>
    </div>
</div>

<script>
    $(document).ready(function () {
        $("#{{ id }}-toggle").on("click", function () {
            toggleDropdown("{{ id }}");
        });

        $("#{{ id }}-menu a").on("click", function () {
            $("#{{ id }}-menu").hide();
            if ($(this).data("value") == "Series")
                fireEvent(new EditEvent("{{ id }}-toggle", "Event", "{{ uid }}", null, "Series"));
            else {
                fireEvent(
                    new EditEvent(
                        "{{ id }}-toggle",
                        "Event",
                        "{{ uid }}",
                        "{{ rid }}",
                        $(this).data("value"),
                    ),
                );
            }
        });

        $(document).on("click", function (e) {
            if (!$(e.target).closest("#{{ id }}-dropdown").length) {
                $("#{{ id }}-menu").hide();
            }
        });
    });
</script>
