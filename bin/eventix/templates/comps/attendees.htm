<div id="{{ id }}-attendees" class="ev_form_attendees_list">
    {% if attendees.names.is_empty() %}
        -
    {% else %}
        {% for (i, (att, role)) in attendees.names.iter().zip(attendees.roles).enumerate() %}
            <div id="{{ id }}-attendee_{{ i }}" class="ev_form_attendee_row ev_pad_bottom">
                <a class="ev_form_attendee_role" href="javascript:toggleRole({{ i }})">
                    {% if role == &AttendeeRole::Required %}
                        <i id="{{ id }}_roleicon_{{ i }}" class="bi bi-person-fill"></i>
                    {% else %}
                        <i id="{{ id }}_roleicon_{{ i }}" class="bi bi-person"></i>
                    {% endif %}
                </a>
                <input
                    type="hidden"
                    id="{{ id }}_role_{{ i }}"
                    name="{{ name }}[role][{{ i }}]"
                    value="{{ role }}"
                />
                <input
                    class="ev_form_attendee_input"
                    type="text"
                    name="{{ name }}[name][{{ i }}]"
                    value="{{ att }}"
                />
                <input
                    class="ev_form_attendee_remove"
                    type="button"
                    value="{{ "Remove"|t(locale) }}"
                    onclick="removeAttendee({{ i }})"
                />
            </div>
        {% endfor %}
    {% endif %}
</div>
<div class="ev_attendee_new">
    <span class="ev_attendee_new_label">{{ "New attendee"|t(locale) }}:</span>
    <input id="{{ id }}-new-attendee" class="ev_attendee_new_input" />
    <input type="button" onclick="addAttendee()" value="{{ "Add"|t(locale) }}" />
</div>

<!-- prettier-ignore-start -->
<script>
    function toggleRole(id) {
        if ($("#{{ id }}_roleicon_" + id).hasClass("bi-person-fill")) {
            $("#{{ id }}_roleicon_" + id).removeClass("bi-person-fill");
            $("#{{ id }}_roleicon_" + id).addClass("bi-person");
            $("#{{ id }}_role_" + id).val("Optional");
        } else {
            $("#{{ id }}_roleicon_" + id).removeClass("bi-person");
            $("#{{ id }}_roleicon_" + id).addClass("bi-person-fill");
            $("#{{ id }}_role_" + id).val("Required");
        }
    }

    window.ev["attendees_{{ id }}"] = {
        {% for (cal, email) in emails %}
        "{{ cal }}": "{{ email }}",
        {% endfor %}
    };

    function addAttendee() {
        const attendee = $("#{{ id }}-new-attendee").val();
        if (attendee.trim() == "")
            return;

        const list = $("#{{ id }}-attendees");
        if (list.html().trim() == "-") {
            list.html("");
            {% if let Some(cal_combo_id) = cal_combo_id %}
            const cal = $("#{{ cal_combo_id }}").val();
            if (cal && window.ev["attendees_{{ id }}"][cal])
                doAddAttendee(list, window.ev["attendees_{{ id }}"][cal]);
            {% endif %}
        }

        doAddAttendee(list, attendee);
        $("#{{ id }}-new-attendee").val("");
    }

    function doAddAttendee(list, attendee) {
        let id = 0;
        for (; ; ++id) {
            const el = document.getElementById("{{ id }}-attendee_" + id);
            if (el == null) break;
            if ($("#{{ id }}-attendee-name-" + id).val() == attendee) return;
        }

        list.html(list.html() + '\
            <div id="{{ id }}-attendee_' + id + '" class="ev_form_attendee_row ev_pad_bottom">\
                <a class="ev_form_attendee_role" href="javascript:toggleRole(' + id + ')">\
                    <i id="{{ id }}_roleicon_' + id + '" class="bi bi-person-fill"></i>\
                </a>\
                <input type="hidden" id="{{ id }}_role_' + id + '"\
                       name="{{ name }}[role][' + id + ']" value="Required"/>\
                <input class="ev_form_attendee_input" type="text" size="50" id="{{ id }}-attendee-name-' + id + '"\
                        name="{{ name }}[name][' + id + ']"\
                        value="' + attendee + '"/>\
                <input class="ev_form_attendee_remove" type="button" value="{{ "Remove"|t(locale) }}"\
                       onclick="removeAttendee(' + id + ')" />\
            </div>\
        ');
    }
</script>
<!-- prettier-ignore-end -->

<script>
    function removeAttendee(id) {
        $("#{{ id }}-attendee_" + id).remove();

        const list = $("#{{ id }}-attendees");
        if (list.html().trim() == "") {
            list.html("-");
        }
    }

    $(function () {
        $("#{{ id }}-new-attendee").autocomplete({
            source: "/api/attendees",
            minLength: 2,
        });
        $("#{{ id }}-new-attendee").keyup(function (e) {
            if (e.keyCode == 13) {
                addAttendee();
            }
        });
    });
</script>
