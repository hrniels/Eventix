name: Benchmark

on:
  pull_request: {}
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: iCalendar Parsing Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/rust-setup

      - name: Run parse benchmark
        id: parse
        run: |
          set -o pipefail
          # Cached Criterion baselines may be incomplete; history is tracked by the benchmark action.
          criterion_dir=$(mktemp -d "$RUNNER_TEMP/criterion.XXXXXX")
          echo "criterion-dir=$criterion_dir" >> "$GITHUB_OUTPUT"
          export CRITERION_HOME="$criterion_dir"
          cargo bench -p eventix-ical --bench parse -- --sample-size 30 --warm-up-time 1 \
            --measurement-time 3 2>&1 | tee benchmark-parse.txt
          # Criterion can log errors while still exiting successfully.
          if rg -n 'Criterion\.rs ERROR:' benchmark-parse.txt; then
            echo "::error::Criterion reported an error; see benchmark-parse.txt"
            exit 1
          fi

      - name: Export parse benchmark JSON
        run: python3 tools/export_bench.py --input-dir "${{ steps.parse.outputs.criterion-dir }}/ics_parse_directory" --output benchmark-parse.json

      - name: Store parse benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Eventix Parse Benchmark
          tool: customSmallerIsBetter
          output-file-path: benchmark-parse.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          alert-threshold: 150%
          comment-on-alert: false
          fail-on-alert: false
          max-items-in-chart: 200

      - name: Upload raw benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: |-
            benchmark-parse.txt
            benchmark-parse.json
